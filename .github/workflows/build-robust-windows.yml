name: Build robust (Windows)

on:
  workflow_dispatch:
    inputs:
      robust_ref:
        description: robust git ref (branch/tag/sha)
        required: false
        default: main
        type: string

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            make

      - name: Checkout workflows repo (patch script)
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Checkout robust
        uses: actions/checkout@v4
        with:
          repository: bigattichouse/robust
          ref: ${{ inputs.robust_ref }}
          path: robust

      - name: Patch taguchi CLI for Windows
        run: python ../workflows/scripts/patch_taguchi_windows.py optimize/taguchi/src/cli/main.c
        working-directory: robust

      - name: Build taguchi (skip morris/fork/runner on Windows)
        working-directory: robust
        run: |
          set -euo pipefail
          # runner.c uses fork/exec (sys/wait.h) — not available on Windows.
          # taguchi CLI only needs csv/json/space from common, not doe_run.
          mapfile -t COMMON_SRC < <(find core/src -name '*.c' ! -name 'runner.c' | sort)
          COMMON_OBJ=()
          for src in "${COMMON_SRC[@]}"; do
            base=$(basename "$src" .c)
            COMMON_OBJ+=("build/common/${base}.o")
          done
          make build/taguchi.dll "COMMON_SRC=${COMMON_SRC[*]}" "COMMON_OBJ=${COMMON_OBJ[*]}"
          make build/bin/taguchi "COMMON_SRC=${COMMON_SRC[*]}" "COMMON_OBJ=${COMMON_OBJ[*]}"
          test -f build/taguchi.dll
          test -f build/bin/taguchi.exe || test -f build/bin/taguchi
          ./build/bin/taguchi list-arrays --json | head -c 200
          ls -la build/taguchi.dll build/bin/taguchi*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robust-windows-build
          path: |
            robust/build/taguchi.dll
            robust/build/bin/taguchi.exe
            robust/build/bin/taguchi
          if-no-files-found: error
